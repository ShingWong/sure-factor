name: form
description: Basic single-record form with single-column layout for creating or editing an entity
tier: vibe
parameters:
  fields:
    - name: fields
      type: text
      required: true
    - name: submitLabel
      type: text
      required: false
    - name: cancelLabel
      type: text
      required: false
  submitLabel:
    en: Submit
    es: Enviar
    fr: Soumettre
  cancelLabel:
    en: Cancel
    es: Cancelar
    fr: Annuler
behavior:
  notificationModes:
    - inline
    - toast
    - statusBar
    - sidePanel
  audio:
    errorBell: true
    successChime: false
  voiceHelp: false
  autoFocus: true
  confirmBeforeCancel: false
scripts:
  - audio-feedback.js
  - voice-help.js
  - notification-handler.js
cssClasses:
  form: sure-form
  field: sure-form__field
  input: sure-form__input
  error: sure-form__error
  help: sure-form__help
  label: sure-form__label
example:
  usage: Generate a patient intake form with name, email, diagnosis, and ZIP code fields
