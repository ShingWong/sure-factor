name: contact-form
description: Contact message form with name, email, subject and message fields
tier: vibe
parameters:
  fields:
    - name: name
      type: text
      required: true
    - name: email
      type: email
      required: true
    - name: subject
      type: text
      required: false
    - name: message
      type: text
      required: true
  submitLabel:
    en: Send
    es: Enviar
    fr: Envoyer
  cancelLabel:
    en: Clear
    es: Borrar
    fr: Effacer
behavior:
  notificationModes:
    - inline
    - toast
  audio:
    errorBell: true
    successChime: true
  voiceHelp: false
  autoFocus: true
  confirmBeforeCancel: false
scripts:
  - error-bell.js
  - success-chime.js
sure_ui:
  - form
  - buttons
cssClasses:
  form: sure-form
  field: sure-form__field
  input: sure-form__input
  error: sure-form__error
  help: sure-form__help
  label: sure-form__label
  title: sure-form__title
  actions: sure-form__actions
  submit: btn-primary
  cancel: btn-secondary
example:
  usage: Generate a contact form with name, email, subject and message fields
