name: mail-search-filter
description: Mailbox search bar with facet filter chips (from, to, subject, has-attachment, unread) for incremental mail search
tier: vibe
parameters:
  fields:
    - name: placeholder
      type: text
      required: false
    - name: query
      type: text
      required: false
    - name: filters
      type: text
      required: true
    - name: debounceMs
      type: number
      required: false
    - name: onSearch
      type: text
      required: true
    - name: onClear
      type: text
      required: false
  submitLabel:
    en: Search
    es: Buscar
    fr: Rechercher
  cancelLabel:
    en: Clear Filters
    es: Limpiar Filtros
    fr: Effacer les Filtres
behavior:
  notificationModes:
    - inline
  audio:
    errorBell: false
    successChime: false
  voiceHelp: false
  autoFocus: true
  confirmBeforeCancel: false
scripts:
  - voice-help.js
sure_ui:
  - search
  - buttons
cssClasses:
  form: sure-search
  field: sure-search__input
  input: sure-search__input
  error: sure-search__error
  help: sure-search__help
  label: sure-search__label
  filters: mail-search-filter__chips
example:
  usage: Generate a mailbox search bar with a query input and from/to/subject/attachment/unread filter chips, 300ms debounce
