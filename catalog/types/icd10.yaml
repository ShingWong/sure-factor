name: icd10
description: ICD-10 diagnosis code
match:
  sql: column_name LIKE '%diagnosis%' OR column_name LIKE '%icd%' OR column_name LIKE '%code%'
  regex: ^[A-Z]\d{2}(\.\d{1,4})?$
  maxLength: 8
validation:
  regex: ^[A-Z]\d{2}(\.\d{1,4})?$
  maxLength: 8
  lookup: icd10-codes.json
sanitize:
  input:
    - trim
    - uppercase
    - stripNonAlphanumeric
    - normalize: NFKC
    - slice(0, 8)
  output:
    - htmlEscape
hints:
  en:
    placeholder: 'J45.901'
    help: ICD-10 code (e.g., J45.901 for Asthma)
    error:
      format: Must be a valid ICD-10 code (letter + 2 digits, optional decimal)
      required: Diagnosis code is required
  es:
    placeholder: 'J45.901'
    help: Código CIE-10 (ej., J45.901 Asma)
    error:
      format: Debe ser un código CIE-10 válido (letra + 2 dígitos, decimal opcional)
      required: Código de diagnóstico es obligatorio
  fr:
    placeholder: 'J45.901'
    help: Code CIM-10 (ex., J45.901 pour Asthme)
    error:
      format: Doit être un code CIM-10 valide (lettre + 2 chiffres, décimal optionnel)
      required: Code de diagnostic requis
tiers:
  vibe:
    validation: { regex: ^[A-Z]\d{2}(\.\d{1,4})?$ }
    sanitize: [trim, uppercase, slice(0, 8)]
    hints: { en: { placeholder: 'J45.901' } }
  prototype:
    validation: { regex: ^[A-Z]\d{2}(\.\d{1,4})?$, maxLength: 8 }
    sanitize: [trim, uppercase, stripNonAlphanumeric, normalize: NFKC, slice(0, 8)]
    hints: { en: { placeholder: 'J45.901', help: 'ICD-10 code (e.g., J45.901 for Asthma)' }, es: { placeholder: 'J45.901', help: 'Código CIE-10 (ej., J45.901 Asma)' } }
  production:
    validation: { regex: ^[A-Z]\d{2}(\.\d{1,4})?$, maxLength: 8, lookup: icd10-codes.json }
    sanitize: [trim, uppercase, stripNonAlphanumeric, normalize: NFKC, slice(0, 8)]
    hints: { en: { placeholder: 'J45.901', help: 'ICD-10 code (e.g., J45.901 for Asthma)' }, es: { placeholder: 'J45.901', help: 'Código CIE-10 (ej., J45.901 Asma)' }, fr: { placeholder: 'J45.901', help: 'Code CIM-10 (ex., J45.901 pour Asthme)' } }
security:
  encrypt: true
  notes:
    - 'PHI — encrypt at rest'
    - 'Audit log all accesses'
    - 'Never log full ICD-10 codes without consent'