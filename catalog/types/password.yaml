name: password
description: Password field (never stored in plaintext)
match:
  sql: column_name LIKE '%password%'
  maxLength: 128
validation:
  regex: null
  minLength: 8
  maxLength: 128
  lookup: null
sanitize:
  input:
    - trim
  output:
    - mask
hints:
  en:
    placeholder: '••••••••'
    help: At least 8 characters with uppercase, lowercase, and number
    error:
      format: Must be at least 8 characters with uppercase, lowercase, and a number
      required: Password is required
      tooShort: Must be at least 8 characters
  es:
    placeholder: '••••••••'
    help: Al menos 8 caracteres con mayúscula, minúscula y número
    error:
      format: Debe tener al menos 8 caracteres con mayúscula, minúscula y número
      required: Contraseña es obligatoria
      tooShort: Debe tener al menos 8 caracteres
  fr:
    placeholder: '••••••••'
    help: Au moins 8 caractères avec majuscule, minuscule et chiffre
    error:
      format: Doit contenir au moins 8 caractères avec majuscule, minuscule et chiffre
      required: Mot de passe requis
      tooShort: Doit contenir au moins 8 caractères
tiers:
  vibe:
    validation: { regex: null, minLength: 8, maxLength: 128 }
    sanitize: [trim]
    hints: { en: { placeholder: '••••••••' } }
  prototype:
    validation: { regex: null, minLength: 8, maxLength: 128 }
    sanitize: [trim]
    hints: { en: { placeholder: '••••••••', help: '8+ chars with upper, lower, number' }, es: { placeholder: '••••••••', help: '8+ caracteres con mayúscula, minúscula y número' } }
  production:
    validation: { regex: null, minLength: 8, maxLength: 128, lookup: null }
    sanitize: [trim]
    hints: { en: { placeholder: '••••••••', help: '8+ chars with upper, lower, number' }, es: { placeholder: '••••••••', help: '8+ caracteres con mayúscula, minúscula y número' }, fr: { placeholder: '••••••••', help: '8+ caractères avec majuscule, minuscule, chiffre' } }
security:
  encrypt: true
  notes:
    - 'NEVER log password value at any stage'
    - 'NEVER store plaintext — always hash with bcrypt/argon2'
    - 'Do not reveal password strength indicators to network observers'
    - 'Rate limit login attempts'