name: zip9
description: 9-digit US ZIP+4 code
match:
  sql: column_name LIKE '%zip%' OR column_name LIKE '%postal%'
  maxLength: 10
validation:
  regex: ^\d{5}-\d{4}$
  maxLength: 10
  lookup: null
sanitize:
  input:
    - trim
    - stripNonDigits
    - normalize: NFKC
    - slice(0, 10)
  output:
    - htmlEscape
hints:
  en:
    placeholder: '90210-1234'
    help: 9-digit ZIP+4 code
    error:
      format: Must be in format 90210-1234
      required: ZIP+4 code is required
  es:
    placeholder: '01234-5678'
    help: Código postal de 9 dígitos
    error:
      format: Debe tener formato 01234-5678
      required: Código postal es obligatorio
  fr:
    placeholder: '75001-1234'
    help: Code postal à 9 chiffres format 12345-6789
    error:
      format: Doit être au format 75001-1234
      required: Code postal requis
tiers:
  vibe:
    validation: { regex: ^\d{5}-\d{4}$ }
    sanitize: [trim, htmlEscape]
    hints: { en: { placeholder: '90210-1234' } }
  prototype:
    validation: { regex: ^\d{5}-\d{4}$, maxLength: 10 }
    sanitize: [trim, stripNonDigits, normalize: NFKC, slice(0, 10)]
    hints: { en: { placeholder: '90210-1234', help: '9-digit ZIP+4 code' }, es: { placeholder: '01234-5678', help: 'Código postal de 9 dígitos' } }
  production:
    validation: { regex: ^\d{5}-\d{4}$, maxLength: 10, lookup: us-zip-codes.json }
    sanitize: [trim, stripNonDigits, normalize: NFKC, slice(0, 10)]
    hints: { en: { placeholder: '90210-1234', help: '9-digit ZIP+4 code' }, es: { placeholder: '01234-5678', help: 'Código postal de 9 dígitos' }, fr: { placeholder: '75001-1234', help: 'Code postal à 9 chiffres' } }
security:
  encrypt: false
  notes: []