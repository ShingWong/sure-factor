name: us-phone
description: US phone number with +1 prefix
match:
  sql: column_name LIKE '%phone%' AND data_type IN ('varchar(20)', 'varchar(15)')
  regex: ^\+1\d{10}$
  maxLength: 15
validation:
  regex: ^\+1\d{10}$
  maxLength: 15
  lookup: null
sanitize:
  input:
    - stripNonDigits
    - normalize: NFKC
    - slice(0, 15)
  output:
    - htmlEscape
hints:
  en:
    placeholder: '+1 (555) 123-4567'
    help: US phone number with area code
    error:
      format: Must be a valid US phone number (e.g., +14155551234)
      required: Phone number is required
  es:
    placeholder: '+1 (555) 123-4567'
    help: Número telefónico de EE.UU. con código de área
    error:
      format: Debe ser un número telefónico válido de EE.UU.
      required: Número telefónico es obligatorio
  fr:
    placeholder: '+1 (555) 123-4567'
    help: Numéro de téléphone américain avec indicatif régional
    error:
      format: Doit être un numéro de téléphone américain valide
      required: Numéro de téléphone requis
tiers:
  vibe:
    validation: { regex: ^\+1\d{10}$ }
    sanitize: [stripNonDigits, slice(0, 15)]
    hints: { en: { placeholder: '+1 (555) 123-4567' } }
  prototype:
    validation: { regex: ^\+1\d{10}$, maxLength: 15 }
    sanitize: [stripNonDigits, normalize: NFKC, slice(0, 15)]
    hints: { en: { placeholder: '+1 (555) 123-4567', help: 'US phone number with area code' }, es: { placeholder: '+1 (555) 123-4567', help: 'Número telefónico de EE.UU. con código de área' } }
  production:
    validation: { regex: ^\+1\d{10}$, maxLength: 15, lookup: null }
    sanitize: [stripNonDigits, normalize: NFKC, slice(0, 15)]
    hints: { en: { placeholder: '+1 (555) 123-4567', help: 'US phone number with area code' }, es: { placeholder: '+1 (555) 123-4567', help: 'Número telefónico de EE.UU. con código de área' }, fr: { placeholder: '+1 (555) 123-4567', help: 'Numéro de téléphone américain avec indicatif régional' } }
security:
  encrypt: false
  notes: []