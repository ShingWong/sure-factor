name: zip5
description: 5-digit US ZIP code
match:
  sql: column_name LIKE '%zip%' OR column_name LIKE '%postal%'
  regex: ^\d{5}$
  maxLength: 5
validation:
  regex: ^\d{5}$
  maxLength: 5
  lookup: null
sanitize:
  input:
    - trim
    - stripNonDigits
    - normalize: NFKC
    - slice(0, 5)
  output:
    - htmlEscape
hints:
  en:
    placeholder: '90210'
    help: 5-digit US ZIP code
    error:
      format: Must be exactly 5 digits
      required: ZIP code is required
  es:
    placeholder: '01234'
    help: Código postal de 5 dígitos
    error:
      format: Debe tener exactamente 5 dígitos
      required: Código postal es obligatorio
  fr:
    placeholder: '75001'
    help: Code postal américain à 5 chiffres
    error:
      format: Doit contenir exactement 5 chiffres
      required: Code postal requis
tiers:
  vibe:
    validation: { regex: ^\d{5}$ }
    sanitize: [trim, htmlEscape]
    hints: { en: { placeholder: '90210' } }
  prototype:
    validation: { regex: ^\d{5}$, maxLength: 5 }
    sanitize: [trim, stripNonDigits, normalize: NFKC, slice(0, 5)]
    hints: { en: { placeholder: '90210', help: '5-digit US ZIP code' }, es: { placeholder: '01234', help: 'Código postal de 5 dígitos' } }
  production:
    validation: { regex: ^\d{5}$, maxLength: 5, lookup: us-zip-codes.json }
    sanitize: [trim, stripNonDigits, normalize: NFKC, slice(0, 5)]
    hints: { en: { placeholder: '90210', help: '5-digit US ZIP code' }, es: { placeholder: '01234', help: 'Código postal de 5 dígitos' }, fr: { placeholder: '75001', help: 'Code postal américain à 5 chiffres' } }
security:
  encrypt: false
  notes: []