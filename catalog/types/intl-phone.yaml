name: intl-phone
description: International phone number
match:
  sql: column_name LIKE '%phone_intl%' OR column_name LIKE '%mobile%'
  regex: ^\+\d{7,15}$
  maxLength: 20
validation:
  regex: ^\+\d{7,15}$
  maxLength: 20
  lookup: null
sanitize:
  input:
    - stripNonDigits
    - normalize: NFKC
    - slice(0, 20)
  output:
    - htmlEscape
hints:
  en:
    placeholder: '+44 20 7946 0958'
    help: International phone number starting with + and country code
    error:
      format: Must start with + and contain 7-15 digits
      required: Phone number is required
  es:
    placeholder: '+34 91 123 4567'
    help: Número telefónico internacional comenzando con + y código de país
    error:
      format: Debe comenzar con + y contener 7-15 dígitos
      required: Número telefónico es obligatorio
  fr:
    placeholder: '+33 1 23 45 67 89'
    help: Numéro de téléphone international commençant par + et indicatif du pays
    error:
      format: Doit commencer par + et contenir 7-15 chiffres
      required: Numéro de téléphone requis
tiers:
  vibe:
    validation: { regex: ^\+\d{7,15}$ }
    sanitize: [stripNonDigits, slice(0, 20)]
    hints: { en: { placeholder: '+44 20 7946 0958' } }
  prototype:
    validation: { regex: ^\+\d{7,15}$, maxLength: 20 }
    sanitize: [stripNonDigits, normalize: NFKC, slice(0, 20)]
    hints: { en: { placeholder: '+44 20 7946 0958', help: 'International phone starting with +' }, es: { placeholder: '+34 91 123 4567', help: 'Número internacional comenzando con +' } }
  production:
    validation: { regex: ^\+\d{7,15}$, maxLength: 20, lookup: null }
    sanitize: [stripNonDigits, normalize: NFKC, slice(0, 20)]
    hints: { en: { placeholder: '+44 20 7946 0958', help: 'International phone starting with +' }, es: { placeholder: '+34 91 123 4567', help: 'Número internacional comenzando con +' }, fr: { placeholder: '+33 1 23 45 67 89', help: 'Numéro international commençant par +' } }
security:
  encrypt: false
  notes: []