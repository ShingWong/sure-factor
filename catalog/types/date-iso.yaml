name: date-iso
description: ISO 8601 date
match:
  sql: data_type = 'date'
  regex: ^\d{4}-\d{2}-\d{2}$
  maxLength: 10
validation:
  regex: ^\d{4}-\d{2}-\d{2}$
  maxLength: 10
  lookup: null
sanitize:
  input:
    - trim
    - normalize: NFKC
    - slice(0, 10)
  output:
    - htmlEscape
hints:
  en:
    placeholder: '2026-07-24'
    help: Date in YYYY-MM-DD format
    error:
      format: Must be a valid date in YYYY-MM-DD format
      required: Date is required
  es:
    placeholder: '2026-07-24'
    help: Fecha en formato AAAA-MM-DD
    error:
      format: Debe ser una fecha válida en formato AAAA-MM-DD
      required: Fecha es obligatoria
  fr:
    placeholder: '2026-07-24'
    help: Date au format AAAA-MM-JJ
    error:
      format: Doit être une date valide au format AAAA-MM-JJ
      required: Date requise
tiers:
  vibe:
    validation: { regex: ^\d{4}-\d{2}-\d{2}$ }
    sanitize: [trim, slice(0, 10)]
    hints: { en: { placeholder: '2026-07-24' } }
  prototype:
    validation: { regex: ^\d{4}-\d{2}-\d{2}$, maxLength: 10 }
    sanitize: [trim, normalize: NFKC, slice(0, 10)]
    hints: { en: { placeholder: '2026-07-24', help: 'Date in YYYY-MM-DD' }, es: { placeholder: '2026-07-24', help: 'Fecha en AAAA-MM-DD' } }
  production:
    validation: { regex: ^\d{4}-\d{2}-\d{2}$, maxLength: 10, lookup: null }
    sanitize: [trim, normalize: NFKC, slice(0, 10)]
    hints: { en: { placeholder: '2026-07-24', help: 'Date in YYYY-MM-DD' }, es: { placeholder: '2026-07-24', help: 'Fecha en AAAA-MM-DD' }, fr: { placeholder: '2026-07-24', help: 'Date au format AAAA-MM-JJ' } }
security:
  encrypt: false
  notes: []