name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref; keep master green at every commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the floor implied by ES2022 + nodenext resolution and the
          # engines of vitest (^18 || >=20).
          node-version: 20
          cache: npm

      # npm ci, not npm install: this is what verifies the committed lockfile is
      # actually reproducible.
      - name: Install
        run: npm ci

      # Needs a real Chromium. Kept as its own step so a browser download
      # failure is attributable rather than looking like a dependency problem.
      - name: Install Chromium for the render tests
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runs test:unit then test:e2e. Neither should need credentials: the
      # database tests use an injected client, and the connection-failure path
      # is asserted against localhost port 1.
      - name: Test
        run: npm test

      # Fails the build if tsc ever emits a test artifact into dist again.
      - name: Verify dist has no test artifacts
        run: |
          if find dist -name '*.test.*' | grep -q .; then
            echo "::error::test artifacts found in dist"
            find dist -name '*.test.*' -print
            exit 1
          fi
          echo "dist is clean"

      # Guards the published surface: every entry in the exports map must point
      # at a file the build actually produced.
      - name: Verify package exports resolve
        run: node scripts/check-exports.mjs

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
